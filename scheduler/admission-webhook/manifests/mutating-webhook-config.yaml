apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: saiep-pod-mutator
webhooks:
  - name: mutate.saiep.estin.dz
    clientConfig:
      service:
        name: saiep-webhook-svc
        namespace: default
        path: "/mutate"
      caBundle: ""
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail # Strict enforcement: If webhook is down, pod is denied.