apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saiep-scheduler-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Bendaoud-Bilal/ESTIN-SAIEP.git'
    targetRevision: scheduler
    path: scheduler/policies
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true