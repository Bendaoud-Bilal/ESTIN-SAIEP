apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: interactive-tier
value: 1000
globalDefault: false
description: "Tier 1: High priority, low latency. Preempts Tier 2 & 3."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: batch-tier
value: 500
globalDefault: false
description: "Tier 2: Batch training jobs. Preempts Tier 3."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: background-tier
value: 100
globalDefault: true
description: "Tier 3: Best-effort background jobs. No preemption rights."