# Cluster-wide roles used by the Scheduling Layer.
# Minimal RBAC needed for the pipeline to function (the full Security Layer —
# Kyverno, org RBAC — is out of scope here and lives under security/).

# Argo executor (init/wait containers) in tenant pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: saiep-runner-executor
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
# Read-only view of a tenant's own namespace (bound per namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: saiep-tenant
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
# Identity of the JupyterHub "Job Intake" (hub runs outside the cluster and
# uses a kubeconfig for this ServiceAccount, generated by saiep_cli).
apiVersion: v1
kind: Namespace
metadata:
  name: saiep-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: saiep-hub
  namespace: saiep-system
---
apiVersion: v1
kind: Secret
metadata:
  name: saiep-hub-token
  namespace: saiep-system
  annotations:
    kubernetes.io/service-account.name: saiep-hub
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: saiep-hub
rules:
  # Namespace provisioning (tenant bundle).
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [resourcequotas, limitranges, serviceaccounts]
    verbs: [get, create, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, create, patch]
  # Tenant log-archive credential only. Server-side apply is a PATCH that
  # carries the name, so create can be name-scoped too. No get/list: the hub
  # cannot read other Secrets.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, patch]
    resourceNames: [saiep-artifacts]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, create, patch]
  # Allowed to bind only these two roles (no privilege escalation).
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [bind]
    resourceNames: [saiep-runner-executor, saiep-tenant]
  # Job intake + lifecycle.
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list, watch, create, patch]
  # KubeSpawner notebooks: list/watch across saiep-u-* for its reflectors,
  # create/delete Pods and PVCs in each user's tenant namespace.
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims, services]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: saiep-hub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: saiep-hub
subjects:
  - kind: ServiceAccount
    name: saiep-hub
    namespace: saiep-system
---
# Live API server endpoints for the tenant egress rule (k8s.api_server_endpoints):
# read-only, this one EndpointSlice only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: saiep-hub-apiserver-endpoints
  namespace: default
rules:
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get]
    resourceNames: [kubernetes]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: saiep-hub-apiserver-endpoints
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: saiep-hub-apiserver-endpoints
subjects:
  - kind: ServiceAccount
    name: saiep-hub
    namespace: saiep-system
---
# RBAC cannot scope namespace create/delete by name, so a native admission
# policy confines the hub identity to tenant namespaces (saiep-u-*): a
# compromised hub cannot touch kube-system, argo, saiep-system, ...
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: saiep-hub-tenant-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["", rbac.authorization.k8s.io, networking.k8s.io, argoproj.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [namespaces, resourcequotas, limitranges, serviceaccounts, rolebindings, networkpolicies, secrets, workflows, pods, persistentvolumeclaims, services]
  matchConditions:
    - name: is-saiep-hub
      expression: request.userInfo.username == 'system:serviceaccount:saiep-system:saiep-hub'
  validations:
    - expression: >-
        request.resource.resource == 'namespaces'
        ? request.name.startsWith('saiep-u-')
        : request.namespace.startsWith('saiep-u-')
      message: saiep-hub may only manage saiep-u-* tenant namespaces
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: saiep-hub-tenant-scope
spec:
  policyName: saiep-hub-tenant-scope
  validationActions: [Deny]
