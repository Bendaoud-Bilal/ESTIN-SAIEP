# SAIEP artifact/log store (architecture: "Metrics Emitter -> MinIO, append-only").
#
#   saiep-artifacts : Argo archived job logs (archiveLogs), written by the Argo
#                     executor (wait container) of tenant pods. Expire after 30 d.
#   saiep-records   : scheduling decision records, one object per record,
#                     written by the hub. Versioned; nobody holds a delete right.
#
# Credentials are generated by saiep_cli (platform.ensure_minio_secrets) into
# the Secrets saiep-minio-root and saiep-minio-users — never committed.
# MinIO users (least privilege, see the setup Job policies):
#   argo-executor : PutObject on saiep-artifacts only (no read, no list)
#   saiep-hub     : GetObject on saiep-artifacts, PutObject on saiep-records
# Images: upstream MinIO no longer publishes container images; Chainguard
# builds (non-root uid 65532) are pinned by digest.
apiVersion: v1
kind: Namespace
metadata:
  name: saiep-storage
  labels:
    app.kubernetes.io/part-of: saiep
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: saiep-minio-data
  namespace: saiep-storage
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 20Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saiep-minio
  namespace: saiep-storage
  labels: {app: saiep-minio}
spec:
  replicas: 1
  strategy: {type: Recreate}  # RWO volume
  selector:
    matchLabels: {app: saiep-minio}
  template:
    metadata:
      labels: {app: saiep-minio}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio@sha256:c93745c56fccdaf0e5dcb88999a96a65a136428beb045ef5d546255a80d747a7
          args: [server, /data, --address, ":9000"]
          env:
            - {name: MINIO_BROWSER, value: "off"}  # no web console
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: saiep-minio-root, key: rootUser}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: saiep-minio-root, key: rootPassword}}
          ports:
            - {name: s3, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /minio/health/live, port: s3}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: saiep-minio-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: saiep-minio
  namespace: saiep-storage
spec:
  selector: {app: saiep-minio}
  ports:
    - {name: s3, port: 9000, targetPort: s3}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: saiep-minio-policies
  namespace: saiep-storage
data:
  argo-executor.json: |
    {"Version": "2012-10-17", "Statement": [
      {"Effect": "Allow", "Action": ["s3:PutObject"], "Resource": ["arn:aws:s3:::saiep-artifacts/*"]},
      {"Effect": "Allow", "Action": ["s3:GetBucketLocation"], "Resource": ["arn:aws:s3:::saiep-artifacts"]}
    ]}
  saiep-hub.json: |
    {"Version": "2012-10-17", "Statement": [
      {"Effect": "Allow", "Action": ["s3:GetObject"], "Resource": ["arn:aws:s3:::saiep-artifacts/*"]},
      {"Effect": "Allow", "Action": ["s3:PutObject"], "Resource": ["arn:aws:s3:::saiep-records/*"]},
      {"Effect": "Allow", "Action": ["s3:GetBucketLocation"],
       "Resource": ["arn:aws:s3:::saiep-artifacts", "arn:aws:s3:::saiep-records"]}
    ]}
  setup.sh: |
    set -eu
    export MC_CONFIG_DIR=/tmp/mc
    export MC_HOST_saiep="http://${ROOT_USER}:${ROOT_PASSWORD}@saiep-minio.saiep-storage.svc:9000"
    until mc ready saiep >/dev/null 2>&1; do sleep 2; done
    mc mb --ignore-existing saiep/saiep-artifacts saiep/saiep-records
    mc version enable saiep/saiep-records
    mc ilm rule ls saiep/saiep-artifacts 2>/dev/null | grep -q 'Expiration' \
      || mc ilm rule add --expire-days 30 saiep/saiep-artifacts
    for p in argo-executor saiep-hub; do
      mc admin policy create saiep "$p" "/policies/$p.json"
    done
    mc admin user add saiep "$EXECUTOR_ACCESS_KEY" "$EXECUTOR_SECRET_KEY"
    mc admin user add saiep "$HUB_ACCESS_KEY" "$HUB_SECRET_KEY"
    # attach fails when already attached: tolerate only that case
    attach() { mc admin policy attach saiep "$1" --user "$2" 2>&1 | grep -v 'already' || true; }
    attach argo-executor "$EXECUTOR_ACCESS_KEY"
    attach saiep-hub "$HUB_ACCESS_KEY"
    mc admin user info saiep "$EXECUTOR_ACCESS_KEY" | grep -q argo-executor
    mc admin user info saiep "$HUB_ACCESS_KEY" | grep -q saiep-hub
    echo "MinIO buckets, policies and users ready"
---
# Idempotent bootstrap; saiep_cli deletes and re-applies it on each deploy.
apiVersion: batch/v1
kind: Job
metadata:
  name: saiep-minio-setup
  namespace: saiep-storage
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: setup
          # -dev variant: needs a shell for the script
          image: cgr.dev/chainguard/minio-client@sha256:8d736271bb105639f2348d04186e748bbed63c5392e4ce86641453c11b53f3c8
          command: [sh, /policies/setup.sh]
          env:
            - name: ROOT_USER
              valueFrom: {secretKeyRef: {name: saiep-minio-root, key: rootUser}}
            - name: ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: saiep-minio-root, key: rootPassword}}
            - name: EXECUTOR_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: saiep-minio-users, key: executorAccessKey}}
            - name: EXECUTOR_SECRET_KEY
              valueFrom: {secretKeyRef: {name: saiep-minio-users, key: executorSecretKey}}
            - name: HUB_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: saiep-minio-users, key: hubAccessKey}}
            - name: HUB_SECRET_KEY
              valueFrom: {secretKeyRef: {name: saiep-minio-users, key: hubSecretKey}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: policies, mountPath: /policies}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: policies
          configMap: {name: saiep-minio-policies}
        - name: tmp
          emptyDir: {}
